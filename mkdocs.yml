site_name: MASAMI的外置大脑
site_description: 个人学习笔记站：深度学习、计算机视觉等
site_url: https://linxiawmt.github.io/MASAMI-Brain/
repo_url: https://github.com/linxiawmt/MASAMI-Brain
repo_name: linxiawmt/MASAMI-Brain

theme:
  name: material
  language: zh
  copyright: 页面装饰插画来自网络，仅作学习装饰用途，版权归原作者所有
  font: false                 # 不加载 Google Fonts（国内访问慢），用系统字体栈
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      slugify: !!python/name:pymdownx.slugs._uslugify
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/mermaid.min.js
  - javascripts/mermaid-init.js
  - javascripts/gallery.js
  - javascripts/site-toc.js
  - javascripts/mathjax/tex-mml-chtml.js

extra_css:
  - stylesheets/custom.css
  - stylesheets/site-toc.css

